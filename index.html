<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Little English</title><style>body{margin:0;background:#f7f5ef;color:#26352d;font-family:system-ui,-apple-system,sans-serif}main{max-width:620px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:25px;margin:5px 0}.muted{color:#738077;font-size:13px}.card{background:white;border-radius:24px;padding:22px;margin-top:20px;box-shadow:0 8px 25px #26352d0b}.scene{font-size:100px;text-align:center;background:#eef5e8;border-radius:20px;padding:25px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.choice{font-size:52px;background:#f2f5ef;border:2px solid transparent;border-radius:18px;padding:15px;cursor:pointer}button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:14px 18px;background:#356b4b;color:white}button.secondary{background:#e6eee5;color:#264632}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.prompt{font-size:24px;font-weight:700;margin:18px 0}.status{min-height:48px;line-height:1.6}.progress{height:8px;border-radius:10px;background:#e0e8dd;overflow:hidden}.bar{height:100%;background:#71a77a;width:0;transition:.3s}.small{font-size:13px}#speech{font-weight:600}.pill{background:#e8f0e7;padding:7px 12px;border-radius:30px;font-size:12px}</style></head><body><main><header><div><div class="muted">Learn like a child</div><h1>🌱 Little English</h1></div><span class="pill" id="stage">Listening</span></header><p class="muted">日本語に訳さず、聞く → わかる → 話す。</p><div class="progress"><div class="bar" id="bar"></div></div><section class="card"><div class="muted" id="step"></div><div class="scene" id="scene">🍎</div><div class="prompt" id="prompt"></div><div id="choices" class="choices"></div><div id="speech"></div><div class="status" id="status" aria-live="polite"></div><div class="actions"><button id="listen" onclick="document.getElementById('status').textContent='🔊 再生ボタンを押しました。音声を準備しています…'">🔊 Listen</button><button id="mic" class="secondary" style="display:none">🎙 Speak</button><button id="next" style="display:none">Continue →</button></div></section><p class="muted small">音声認識は対応ブラウザで利用できます。マイクが使えない場合は「I said it」で先に進めます。読み上げは端末の英語音声を使用します。</p></main><script>
const items=[{emoji:'🍎',word:'apple'},{emoji:'🍌',word:'banana'},{emoji:'💧',word:'water'}];let phase=0,index=0,passed=false;const $=id=>document.getElementById(id);const total=items.length*3;function say(t){if(!('speechSynthesis'in window)){msg('このブラウザは音声読み上げに対応していません。');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.78;u.onerror=()=>msg('音声を再生できません。Safariなどのブラウザで開いてください。');speechSynthesis.speak(u)}function msg(t){$('status').textContent=t}function render(){passed=false;let item=items[index];$('bar').style.width=((phase*3+index)/total*100)+'%';$('step').textContent=`${phase===0?'1. Listen':phase===1?'2. Understand':'3. Speak'} · ${index+1} / 3`;$('stage').textContent=['Listening','Understanding','Speaking'][phase];$('choices').innerHTML='';$('speech').textContent='';$('mic').style.display=phase===2?'inline-block':'none';$('next').style.display=phase===0?'inline-block':'none';$('next').textContent='Continue →';$('listen').style.display='inline-block';if(phase===0){$('scene').textContent=item.emoji;$('prompt').textContent='Listen carefully.';msg('絵を見ながら、音を何度か聞いてみましょう。');say(`This is an ${item.word==='apple'?'apple':item.word}.`)}else if(phase===1){$('scene').textContent='❔';$('prompt').textContent=`Where is the ${item.word}?`;msg('英語を聞いて、正しい絵をタップしてください。');items.forEach(it=>{let b=document.createElement('button');b.className='choice';b.textContent=it.emoji;b.setAttribute('aria-label',it.word);b.onclick=()=>{if(it.word===item.word){$('scene').textContent=it.emoji;msg('✨ Great!');$('next').style.display='inline-block';passed=true;say('Great job!')}else{msg('Try again. Listen once more.');say(`Where is the ${item.word}?`)}};$('choices').append(b)});say(`Where is the ${item.word}?`)}else{$('scene').textContent=item.emoji;$('prompt').textContent=`I want ${item.word==='water'?'some water':item.word==='apple'?'an apple':'a banana'}.`;$('speech').textContent='Say it aloud.';msg('声に出して言ってみましょう。');say($('prompt').textContent);$('next').style.display='inline-block';$('next').textContent='I said it →'}}function advance(){index++;if(index===items.length){index=0;phase++}if(phase===3){phase=0;index=0;msg('');$('bar').style.width='100%';$('scene').textContent='🎉';$('prompt').textContent='Wonderful!';$('step').textContent='Lesson complete';$('stage').textContent='Finished';$('choices').innerHTML='';$('mic').style.display='none';$('listen').style.display='none';$('next').style.display='inline-block';$('next').textContent='Practice again';$('next').onclick=()=>{ $('next').onclick=advance;render()};say('Wonderful! See you again!');return}render()}$('next').onclick=advance;$('listen').onclick=()=>{msg('🔊 音声を再生しています。聞こえない場合はSafariで開いてください。');let item=items[index];say(phase===0?`This is ${item.word==='apple'?'an apple':item.word==='banana'?'a banana':'water'}.`:phase===1?`Where is the ${item.word}?`:$('prompt').textContent)};$('mic').onclick=()=>{let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){msg('このブラウザでは音声認識が使えません。「I said it」で進めます。');return}let r=new SR();r.lang='en-US';r.interimResults=false;r.onresult=e=>{let heard=e.results[0][0].transcript.toLowerCase();$('speech').textContent=`Heard: ${heard}`;if(heard.includes(items[index].word)){msg('✨ Nice speaking!');say('Very good!')}else{msg('もう一度ゆっくり話してみましょう。');say($('prompt').textContent)}};r.onerror=()=>msg('マイクが使えません。ブラウザのマイク許可を確認してください。');r.start();msg('Listening to you…')};render();</script></body></html>
